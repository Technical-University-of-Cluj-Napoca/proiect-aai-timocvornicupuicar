requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=4.8.5",
    "ipykernel>=7.2.0",
    "langchain>=1.3.1",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.4",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.0",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.9",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "reportlab>=4.5.1",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.58.0",
